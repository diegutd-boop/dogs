<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
<title>Raft</title>
<style>
*{margin:0;padding:0;border:0;overflow:hidden}
body{background:#000;position:fixed;width:100%;height:100%}
#unityContainer{position:absolute;width:100%;height:100%}
#loading-text{position:absolute;z-index:2;width:100%;color:#fff;font:36px cursive;text-align:center;margin-top:20px}
</style>
<script src="Build/UnityLoader.js"></script>
</head>
<body>
<div id="loading-text">LOADING...</div>
<div id="unityContainer"></div>
<script>
// Joins the split files in the browser. UnityLoader.js (modified) reads the joined
// blobs from window.dataUrll / window.asmUrll; every other file loads from Build/.
var PARTS = {
  data: ['Build/Raft-WEBGL.data.unityweb.part1','Build/Raft-WEBGL.data.unityweb.part2','Build/Raft-WEBGL.data.unityweb.part3'],
  code: ['Build/Raft-WEBGL.asm.code.unityweb.part1','Build/Raft-WEBGL.asm.code.unityweb.part2']
};
var total = PARTS.data.length + PARTS.code.length, done = 0;
var label = document.getElementById('loading-text');

function mergeFiles(urls) {
  return Promise.all(urls.map(function (u) {
    return fetch(u).then(function (r) {
      if (!r.ok) throw new Error(u + ' -> HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function (buf) {
      label.textContent = 'LOADING... (' + (++done) + '/' + total + ')';
      return buf;
    });
  })).then(function (bufs) { return URL.createObjectURL(new Blob(bufs)); });
}

function resize() {
  var c = document.getElementById('unityContainer');
  c.style.width = innerWidth + 'px';
  c.style.height = innerHeight + 'px';
}

Promise.all([mergeFiles(PARTS.data), mergeFiles(PARTS.code)]).then(function (r) {
  window.dataUrll = r[0];
  window.asmUrll = r[1];
  var config = {
    TOTAL_MEMORY: 268435456,
    dataUrl: 'Raft-WEBGL.data.unityweb',
    asmCodeUrl: 'Raft-WEBGL.asm.code.unityweb',
    asmMemoryUrl: 'Raft-WEBGL.asm.memory.unityweb',
    asmFrameworkUrl: 'Raft-WEBGL.asm.framework.unityweb',
    splashScreenStyle: 'Dark',
    backgroundColor: '#000000'
  };
  var cfgUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: 'application/json' }));
  addEventListener('resize', resize);
  UnityLoader.instantiate('unityContainer', config, {
    url: cfgUrl,
    Module: { onRuntimeInitialized: function () { resize(); label.remove(); } }
  });
}).catch(function (e) {
  label.textContent = 'Failed to load: ' + e.message;
});
</script>
</body>
</html>
